# OssPilot 本地联调 — 只拉 ghcr 镜像，不 build 兄弟仓源码。
# Ceph/RGW/ONLYOFFICE 外接，见 .env.example。
#
#   cp compose/.env.example compose/.env
#   docker compose -f compose/docker-compose.yml --env-file compose/.env up -d

name: osspilot

services:
  tenant-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: osspilot
      POSTGRES_PASSWORD: osspilot
      POSTGRES_DB: osspilot_tenant
    ports:
      - "5432:5432"
    volumes:
      - tenant_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osspilot -d osspilot_tenant"]
      interval: 5s
      timeout: 5s
      retries: 10

  ops-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: osspilot
      POSTGRES_PASSWORD: osspilot
      POSTGRES_DB: osspilot_ops
    ports:
      - "5433:5432"
    volumes:
      - ops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osspilot -d osspilot_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  tenant-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  tenant-migrate:
    image: ghcr.io/cyxc1124/osspilot-tenant-api:${IMAGE_TAG:-develop}
    environment:
      DATABASE_URL: postgres://osspilot:osspilot@tenant-postgres:5432/osspilot_tenant?sslmode=disable
    command: ["migrate", "up"]
    depends_on:
      tenant-postgres:
        condition: service_healthy
    restart: "no"

  ops-migrate:
    image: ghcr.io/cyxc1124/osspilot-ops-api:${IMAGE_TAG:-develop}
    environment:
      DATABASE_URL: postgres://osspilot:osspilot@ops-postgres:5432/osspilot_ops?sslmode=disable
    command: ["migrate", "up"]
    depends_on:
      ops-postgres:
        condition: service_healthy
    restart: "no"

  tenant-api:
    image: ghcr.io/cyxc1124/osspilot-tenant-api:${IMAGE_TAG:-develop}
    command: ["api"]
    ports:
      - "8000:8000"
    environment:
      HTTP_ADDR: ":8000"
      DATABASE_URL: postgres://osspilot:osspilot@tenant-postgres:5432/osspilot_tenant?sslmode=disable
      REDIS_URL: redis://tenant-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      PROJECTION_SECRET: ${PROJECTION_SECRET:-change-me-projection}
      TENANT_CORS_ORIGINS: ${TENANT_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      TENANT_API_PUBLIC_URL: ${TENANT_API_PUBLIC_URL:-http://localhost:8000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      RGW_ACCESS_KEY: ${RGW_ACCESS_KEY:-}
      RGW_SECRET_KEY: ${RGW_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      OFFICE_URL: ${OFFICE_URL:-}
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:-}
    depends_on:
      tenant-migrate:
        condition: service_completed_successfully
      tenant-redis:
        condition: service_healthy

  tenant-worker:
    image: ghcr.io/cyxc1124/osspilot-tenant-api:${IMAGE_TAG:-develop}
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://osspilot:osspilot@tenant-postgres:5432/osspilot_tenant?sslmode=disable
      REDIS_URL: redis://tenant-redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      RGW_ACCESS_KEY: ${RGW_ACCESS_KEY:-}
      RGW_SECRET_KEY: ${RGW_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      tenant-migrate:
        condition: service_completed_successfully
      tenant-redis:
        condition: service_healthy

  ops-api:
    image: ghcr.io/cyxc1124/osspilot-ops-api:${IMAGE_TAG:-develop}
    command: ["api"]
    ports:
      - "8001:8001"
    environment:
      HTTP_ADDR: ":8001"
      DATABASE_URL: postgres://osspilot:osspilot@ops-postgres:5432/osspilot_ops?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      TENANT_API_URL: http://tenant-api:8000
      PROJECTION_SECRET: ${PROJECTION_SECRET:-change-me-projection}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      RGW_ACCESS_KEY: ${RGW_ACCESS_KEY:-}
      RGW_SECRET_KEY: ${RGW_SECRET_KEY:-}
      CEPH_MGMT_API_URL: ${CEPH_MGMT_API_URL:-}
      OFFICE_URL: ${OFFICE_URL:-}
    depends_on:
      ops-migrate:
        condition: service_completed_successfully
      tenant-api:
        condition: service_started

  ops-worker:
    image: ghcr.io/cyxc1124/osspilot-ops-api:${IMAGE_TAG:-develop}
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://osspilot:osspilot@ops-postgres:5432/osspilot_ops?sslmode=disable
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      RGW_ACCESS_KEY: ${RGW_ACCESS_KEY:-}
      RGW_SECRET_KEY: ${RGW_SECRET_KEY:-}
      LIFECYCLE_INTERVAL: ${LIFECYCLE_INTERVAL:-1h}
    depends_on:
      ops-migrate:
        condition: service_completed_successfully

  tenant-web:
    image: ghcr.io/cyxc1124/osspilot-tenant-web:${IMAGE_TAG:-develop}
    ports:
      - "8080:8080"
    environment:
      OSSPILOT_API_URL: ${TENANT_WEB_API_URL:-http://localhost:8000}
    depends_on:
      - tenant-api

  ops-web:
    image: ghcr.io/cyxc1124/osspilot-ops-web:${IMAGE_TAG:-develop}
    ports:
      - "8081:8080"
    environment:
      OSSPILOT_API_URL: ${OPS_WEB_API_URL:-http://localhost:8001}
    depends_on:
      - ops-api

volumes:
  tenant_pg:
  ops_pg:
