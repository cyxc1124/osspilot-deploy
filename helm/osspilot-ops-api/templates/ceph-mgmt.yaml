{{- if .Values.cephMgmt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osspilot.fullname" . }}-ceph-mgmt
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: ceph-mgmt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "osspilot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ceph-mgmt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "osspilot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ceph-mgmt
    spec:
      {{- include "osspilot.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: ceph-mgmt
          image: "{{ include "osspilot.image" . }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["ceph-mgmt"]
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: HTTP_ADDR
              value: {{ .Values.cephMgmt.httpAddr | quote }}
            - name: CEPH_MGMT_BACKEND
              value: {{ .Values.cephMgmt.backend | quote }}
            {{- if .Values.cephMgmt.cephConf }}
            - name: CEPH_CONF
              value: {{ .Values.cephMgmt.cephConf | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      {{- include "osspilot.placement" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osspilot.fullname" . }}-ceph-mgmt
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: ceph-mgmt
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.cephMgmt.servicePort }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "osspilot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ceph-mgmt
{{- end }}
