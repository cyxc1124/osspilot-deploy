apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osspilot.fullname" . }}
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: ops-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "osspilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osspilot.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "osspilot.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api
          image: "{{ include "osspilot.image" . }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["api"]
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: HTTP_ADDR
              value: {{ .Values.httpAddr | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: jwt-secret
            - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.jwt.accessTokenExpireMinutes | quote }}
            - name: PROJECTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: projection-secret
            - name: TENANT_API_URL
              value: {{ .Values.tenantApiUrl | quote }}
            {{- $about := .Values.about | default dict }}
            - name: OSSPILOT_TENANT_WORKER_URL
              value: {{ $about.tenantWorkerUrl | default "http://osspilot-tenant-worker:8080" | quote }}
            - name: OSSPILOT_TENANT_WEB_URL
              value: {{ $about.tenantWebUrl | default "http://osspilot-tenant-web:8080" | quote }}
            - name: OSSPILOT_OPS_WORKER_URL
              value: {{ $about.opsWorkerUrl | default "http://osspilot-ops-worker:8080" | quote }}
            - name: OSSPILOT_OPS_WEB_URL
              value: {{ $about.opsWebUrl | default "http://osspilot-ops-web:8080" | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "osspilot.placement" . | nindent 6 }}
