# 复制为 values-local.yaml 或 values-production.yaml 后改。不要提交真实密钥。

global:
  imageTag: "v0.1.0"
  imagePullSecrets:
    - name: ghcr-pull-token

jwt:
  secret: "replace-me"
  accessTokenExpireMinutes: 60
projection:
  secret: "replace-me"

database:
  url: postgres://osspilot:replace-me@ops-postgres:5432/osspilot_ops?sslmode=require
tenantApiUrl: http://osspilot-tenant-api:8000

ingress:
  enabled: true
  className: traefik
  host: oapi.example.com
  annotations:
    cert-manager.io/cluster-issuer: your-cluster-issuer
  tlsSecretName: osspilot-ops-api-tls
