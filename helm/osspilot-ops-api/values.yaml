# 真实密钥用 -f values-local.yaml 覆盖，不要提交。

global:
  imageTag: develop
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

existingSecret: ""

image:
  repository: ghcr.io/cyxc1124/osspilot-ops-api
  tag: ""

replicaCount: 1
httpAddr: ":8001"
tenantApiUrl: http://osspilot-tenant-api:8000

database:
  url: postgres://osspilot:osspilot@osspilot-ops-postgres:5432/osspilot_ops?sslmode=disable

jwt:
  secret: change-me-in-production
  accessTokenExpireMinutes: 60
projection:
  secret: change-me-projection

service:
  type: ClusterIP
  port: 8001
ingress:
  enabled: false
  className: ""
  host: oapi.example.com
  annotations: {}
  tlsSecretName: ""
  certManager:
    clusterIssuer: ""
  ingressRoute:
    http: false
# 默认不启。现网可继续把系统设置 ceph_mgmt_api_url 指外接服务。
# 镜像无 ceph 二进制；backend=ceph 需要自备带 CLI 的镜像或节点。
cephMgmt:
  enabled: false
  httpAddr: ":8082"
  servicePort: 8082
  backend: mock
  cephConf: ""

resources: {}

nodeSelector: {}
affinity: {}
tolerations: []
