# 真实密钥用 -f values-local.yaml 覆盖，不要提交。

global:
  imageTag: develop
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

existingSecret: ""

image:
  repository: ghcr.io/cyxc1124/osspilot-ops-api
  tag: ""

replicaCount: 1
httpAddr: ":8001"
tenantApiUrl: http://osspilot-tenant-api:8000

database:
  url: postgres://osspilot:osspilot@osspilot-ops-postgres:5432/osspilot_ops?sslmode=disable

jwt:
  secret: change-me-in-production
  accessTokenExpireMinutes: 60
projection:
  secret: change-me-projection

# 关于页探活地址。运营 API 读各进程自己报的版本，不要手填 tag。
about:
  tenantWorkerUrl: http://osspilot-tenant-worker:8080
  tenantWebUrl: http://osspilot-tenant-web:8080
  opsWorkerUrl: http://osspilot-ops-worker:8080
  opsWebUrl: http://osspilot-ops-web:8080

service:
  type: ClusterIP
  port: 8001
ingress:
  enabled: false
  className: ""
  host: oapi.example.com
  annotations: {}
  tlsSecretName: ""
  certManager:
    clusterIssuer: ""
  ingressRoute:
    http: false
resources: {}

nodeSelector: {}
affinity: {}
tolerations: []
