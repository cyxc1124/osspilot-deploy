# 真实密钥用 -f values-local.yaml 覆盖，不要提交。

global:
  imageTag: develop
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

existingSecret: ""

image:
  repository: ghcr.io/cyxc1124/osspilot-ops-api
  tag: ""

replicaCount: 1
httpAddr: ":8001"
tenantApiUrl: http://osspilot-tenant-api:8000

database:
  url: postgres://osspilot:osspilot@osspilot-ops-postgres:5432/osspilot_ops?sslmode=disable

jwt:
  secret: change-me-in-production
  accessTokenExpireMinutes: 60
projection:
  secret: change-me-projection

# 关于页展示的运行版本。空则用本 chart 的 image.tag / global.imageTag。
# 六个服务独立发版时在这里填各仓实际 tag。
about:
  components:
    tenantApi: ""
    tenantWorker: ""
    tenantWeb: ""
    opsApi: ""
    opsWorker: ""
    opsWeb: ""

service:
  type: ClusterIP
  port: 8001
ingress:
  enabled: false
  className: ""
  host: oapi.example.com
  annotations: {}
  tlsSecretName: ""
  certManager:
    clusterIssuer: ""
  ingressRoute:
    http: false
resources: {}

nodeSelector: {}
affinity: {}
tolerations: []
