{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osspilot.secretName" . }}
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.database.url | quote }}
  redis-url: {{ .Values.redis.url | quote }}
{{- end }}
