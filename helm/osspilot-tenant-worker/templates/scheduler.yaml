apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osspilot.fullname" . }}-scheduler
  labels:
    {{- include "osspilot.schedulerLabels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "osspilot.schedulerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osspilot.schedulerSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "osspilot.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: scheduler
          image: "{{ include "osspilot.image" . }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["scheduler"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: {{ .Values.httpAddr | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: redis-url
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "osspilot.schedulerPlacement" . | nindent 6 }}
