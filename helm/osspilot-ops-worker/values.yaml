# 真实密钥用 -f values-local.yaml 覆盖，不要提交。

global:
  imageTag: develop
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

existingSecret: ""

image:
  repository: ghcr.io/cyxc1124/osspilot-ops-worker
  tag: ""

replicaCount: 2
scheduler:
  replicaCount: 2
asynqConcurrency: 4
httpAddr: ":8080"
lifecycleInterval: 1h
tenantApiUrl: http://osspilot-tenant-api:8000

database:
  url: postgres://osspilot:osspilot@osspilot-ops-postgres:5432/osspilot_ops?sslmode=disable
redis:
  url: redis://osspilot-tenant-redis:6379/1
projection:
  secret: change-me-projection

resources: {}
nodeSelector: {}
affinity: {}
tolerations: []
