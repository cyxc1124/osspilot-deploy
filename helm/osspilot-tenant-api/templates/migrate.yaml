# hook 早于本 release 的 Secret；库地址从 values 读。
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osspilot.fullname" . }}-migrate
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "osspilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- include "osspilot.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ include "osspilot.image" . }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["migrate", "up"]
          env:
            - name: DATABASE_URL
              {{- if .Values.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database-url
              {{- else }}
              value: {{ .Values.database.url | quote }}
              {{- end }}
      {{- include "osspilot.placement" . | nindent 6 }}
