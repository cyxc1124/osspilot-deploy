apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osspilot.fullname" . }}-tenant-api
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-api
spec:
  replicas: {{ .Values.tenant.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "osspilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tenant-api
  template:
    metadata:
      labels:
        {{- include "osspilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tenant-api
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "osspilot.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api
          image: "{{ .Values.tenant.api.image.repository }}:{{ include "osspilot.imageTag" . }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["api"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HTTP_ADDR
              value: {{ .Values.tenant.api.httpAddr | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: tenant-database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: jwt-secret
            - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.jwt.accessTokenExpireMinutes | quote }}
            - name: PROJECTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: projection-secret
            - name: TENANT_API_PUBLIC_URL
              value: {{ .Values.tenant.api.publicUrl | quote }}
            - name: TENANT_CORS_ORIGINS
              value: {{ .Values.tenant.api.corsOrigins | quote }}
            {{- if .Values.tenant.api.officeUrl }}
            - name: OFFICE_URL
              value: {{ .Values.tenant.api.officeUrl | quote }}
            - name: OFFICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: office-jwt-secret
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          {{- with .Values.tenant.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "osspilot.placement" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osspilot.fullname" . }}-tenant-api
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-api
spec:
  type: {{ .Values.tenant.api.service.type }}
  selector:
    {{- include "osspilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-api
  ports:
    - name: http
      port: {{ .Values.tenant.api.service.port }}
      targetPort: http
{{- include "osspilot.ingress" (dict "root" . "svc" (printf "%s-tenant-api" (include "osspilot.fullname" .)) "port" .Values.tenant.api.service.port "ing" .Values.tenant.api.ingress) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osspilot.fullname" . }}-tenant-worker
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-worker
spec:
  replicas: {{ .Values.tenant.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "osspilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tenant-worker
  template:
    metadata:
      labels:
        {{- include "osspilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tenant-worker
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "osspilot.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: "{{ .Values.tenant.worker.image.repository }}:{{ include "osspilot.imageTag" . }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: tenant-database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "osspilot.secretName" . }}
                  key: redis-url
          {{- with .Values.tenant.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "osspilot.placement" . | nindent 6 }}
