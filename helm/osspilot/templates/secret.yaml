{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osspilot.secretName" . }}
  labels:
    {{- include "osspilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.jwt.secret | quote }}
  projection-secret: {{ .Values.projection.secret | quote }}
  tenant-database-url: {{ .Values.tenant.database.url | quote }}
  ops-database-url: {{ .Values.ops.database.url | quote }}
  redis-url: {{ .Values.tenant.redis.url | quote }}
  office-jwt-secret: {{ .Values.tenant.api.officeJwtSecret | quote }}
{{- end }}
