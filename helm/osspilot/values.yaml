# 集群里自备两套 Postgres（osspilot_tenant / osspilot_ops）和一套 Redis。
# S3 / RGW 在运营端系统设置填写，不在这里注入。
# 真实密钥用 -f values-local.yaml 覆盖，不要提交。

global:
  imageTag: develop
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# 若设置，须含 jwt-secret / projection-secret / tenant-database-url / ops-database-url / redis-url
# 开了 tenant.api.officeUrl 时还要 office-jwt-secret
existingSecret: ""

jwt:
  secret: change-me-in-production
  accessTokenExpireMinutes: 60

projection:
  secret: change-me-projection

tenant:
  database:
    url: postgres://osspilot:osspilot@osspilot-tenant-postgres:5432/osspilot_tenant?sslmode=disable
  redis:
    url: redis://osspilot-tenant-redis:6379/0
  api:
    replicaCount: 1
    image:
      repository: ghcr.io/cyxc1124/osspilot-tenant-api
    httpAddr: ":8000"
    publicUrl: http://localhost:8000
    corsOrigins: "http://localhost:8080"
    officeUrl: ""
    officeJwtSecret: ""
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: false
      className: ""
      host: tapi.example.com
      annotations: {}
      tlsSecretName: ""
    resources: {}
  worker:
    replicaCount: 1
    image:
      repository: ghcr.io/cyxc1124/osspilot-tenant-worker
    resources: {}
  web:
    replicaCount: 1
    image:
      repository: ghcr.io/cyxc1124/osspilot-tenant-web
    apiUrl: http://localhost:8000
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
      className: ""
      host: console.example.com
      annotations: {}
      tlsSecretName: ""
    resources: {}

ops:
  database:
    url: postgres://osspilot:osspilot@osspilot-ops-postgres:5432/osspilot_ops?sslmode=disable
  api:
    replicaCount: 1
    image:
      repository: ghcr.io/cyxc1124/osspilot-ops-api
    httpAddr: ":8001"
    # 空则指向本 release 的租户 API Service
    tenantApiUrl: ""
    cephMgmtApiUrl: ""
    officeUrl: ""
    service:
      type: ClusterIP
      port: 8001
    ingress:
      enabled: false
      className: ""
      host: oapi.example.com
      annotations: {}
      tlsSecretName: ""
    resources: {}
  worker:
    replicaCount: 1
    image:
      repository: ghcr.io/cyxc1124/osspilot-ops-worker
    lifecycleInterval: 1h
    resources: {}
  web:
    replicaCount: 1
    image:
      repository: ghcr.io/cyxc1124/osspilot-ops-web
    apiUrl: http://localhost:8001
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
      className: ""
      host: cmgt.example.com
      annotations: {}
      tlsSecretName: ""
    resources: {}

nodeSelector: {}
affinity: {}
tolerations: []
